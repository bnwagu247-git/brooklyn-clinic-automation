name: Daily Brooklyn Clinic Automation

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Step 1 - Scrape new clinic leads
        run: python scrape_clinics.py || echo "Scraper file missing or failed, continuing to send email..."

      - name: Step 2 - Send daily clinic email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python send_clinics.py

      - name: Commit newly discovered leads back to repository
        run: |
          git config --global user.name "GitHub Action Scraper"
          git config --global user.email "action@github.com"
          git add clinics_master.csv
          git commit -m "Auto-update clinics_master.csv with newly scraped leads [skip ci]" || echo "No new leads found to commit"
          git push